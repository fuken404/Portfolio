# Base de datos para desarrollo local.
# Puerto 5435 porque 5432–5434 los usan otros proyectos en esta máquina.
services:
  db:
    image: postgres:17-alpine
    container_name: portafolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portafolio}
      POSTGRES_USER: ${POSTGRES_USER:-portafolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portafolio}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
